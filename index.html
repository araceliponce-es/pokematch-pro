<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéMatch Pro - Juego de Memoria</title>
  <script src="./main.js" type="module" defer></script>
</head>

<body>

  <header>
    <h1>⚡ PokéMatch Pro ⚡</h1>
    <p>Encuentra las parejas Pokémon en el menor tiempo posible.</p>
  </header>

  <main>
    <section id="score-board">
      <div>Movimientos: <span id="moves-count">0</span></div>
      <div>Parejas: <span id="pairs-count">0 / 6</span></div>
      <div>Tiempo: <span id="timer">00:00</span></div>
      <button id="restart-btn">Reiniciar Partida</button>
    </section>

    <section id="game-board">
      <!-- Las cartas se generarán dinámicamente o se estructurarán aquí en siguientes tareas -->
    </section>
  </main>

  <footer>
    <p>Módulo DWEC - Ciclo DAW</p>
  </footer>

</body>

</html>
